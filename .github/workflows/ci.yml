name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile bin/waterline.py install.py uninstall.py
      - name: Validate plugin manifests
        run: |
          python -c "import json;[json.load(open(f,encoding='utf-8')) for f in ['.zcode-plugin/plugin.json','hooks/hooks.json']];print('manifests OK')"
      - name: CLI smoke test
        run: |
          python bin/waterline.py --version
          python bin/waterline.py --help
          echo '{"prompt":"smoke"}' | python bin/waterline.py --format line --hook
